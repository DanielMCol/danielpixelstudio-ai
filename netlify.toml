# Netlify: sitio estático, se publica la raíz del repositorio tal cual.
[build]
  publish = "."
  command = ""

# Archivos internos del repositorio que no deben ser públicos.
[[redirects]]
  from = "/server.js"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/.env.example"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/SSH_SETUP.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/DEPLOYMENT.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# El inglés pasó a la raíz y el español a /es/ (2026-10-12).
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

# Página 404 en español para rutas /es/ que no existen (solo aplica si el archivo no existe).
[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404
